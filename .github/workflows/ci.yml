name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Detect which models have changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.filter.outputs.models }}
      test-all: ${{ steps.check.outputs.test-all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for PR diffs

      - name: Check if should test all models
        id: check
        run: |
          # Test all models on main branch or if core files changed
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "test-all=true" >> $GITHUB_OUTPUT
            echo "Testing all models (main branch)"
            exit 0
          fi

          # For PRs, compare against base branch
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            DIFF_RANGE="$BASE_SHA...HEAD"
          else
            DIFF_RANGE="HEAD~1 HEAD"
          fi

          # Check for core file changes
          if git diff --name-only $DIFF_RANGE | grep -E "(Cargo.toml|testing/|scripts/|\.github/)"; then
            echo "test-all=true" >> $GITHUB_OUTPUT
            echo "Testing all models (core files changed)"
          else
            echo "test-all=false" >> $GITHUB_OUTPUT
            echo "Testing only changed models"
          fi

      - name: Find changed models
        id: filter
        run: |
          # Determine diff range
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            DIFF_RANGE="$BASE_SHA...HEAD"
            echo "Comparing PR against base: $DIFF_RANGE"
          else
            DIFF_RANGE="HEAD~1 HEAD"
            echo "Comparing last two commits: $DIFF_RANGE"
          fi

          if [[ "${{ steps.check.outputs.test-all }}" == "true" ]]; then
            # Find all models
            models=$(find models -mindepth 2 -maxdepth 2 -type d -name '[!.]*' | jq -R -s -c 'split("\n")[:-1] | map(select(length > 0))')
          else
            # Find only changed models
            changed_files=$(git diff --name-only $DIFF_RANGE)
            models=$(echo "$changed_files" | grep "^models/" | cut -d/ -f1-3 | sort -u | jq -R -s -c 'split("\n")[:-1] | map(select(length > 0))')
          fi

          echo "models=$models" >> $GITHUB_OUTPUT
          echo "Found models to test:"
          echo "$models" | jq -r '.[]'

  # Check workspace-level integrity
  workspace-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Workspace format check
        run: cargo fmt --all -- --check

      - name: Workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

  # Test individual models
  test-models:
    needs: [detect-changes, workspace-check]
    if: ${{ needs.detect-changes.outputs.models != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.detect-changes.outputs.models) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.model }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Extract model info
        id: info
        run: |
          model_name=$(basename ${{ matrix.model }})
          echo "name=$model_name" >> $GITHUB_OUTPUT

      - name: Run unit tests
        working-directory: ${{ matrix.model }}
        run: cargo test --lib

      - name: Run integration tests
        working-directory: ${{ matrix.model }}
        run: cargo test --tests

      - name: Build release binary
        working-directory: ${{ matrix.model }}
        run: cargo build --release

      - name: Summary
        run: |
          echo "## ✅ ${{ steps.info.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "All tests passed for ${{ matrix.model }}" >> $GITHUB_STEP_SUMMARY

  # Build and test FMUs
  fmu-integration:
    needs: [detect-changes, workspace-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git diff in plot filtering

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: testing/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r testing/requirements.txt

      - name: Install FMU packaging tool
        run: |
          cargo install package_fmu_after_build

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fmu-${{ hashFiles('**/Cargo.lock') }}

      - name: Build all FMUs
        run: |
          ./scripts/build-all-fmus.sh

      - name: List built FMUs
        run: |
          echo "Built FMUs:"
          ls -lh fmus/*.fmu

      - name: Run FMU integration tests
        working-directory: testing/fmu-integration-tests
        run: |
          python -m pytest -v --tb=short

      - name: Generate FMU output figures
        id: generate-figures
        continue-on-error: true  # Don't fail the workflow if plot generation fails
        run: |
          # Determine which models to plot
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs, ALWAYS only plot models with actual file changes
            # (independent of test-all flag which affects testing)
            echo "PR mode: plotting only models with changed files"

            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            DIFF_RANGE="$BASE_SHA...HEAD"

            # Find model directories with actual file changes
            changed_files=$(git diff --name-only $DIFF_RANGE)
            changed_model_dirs=$(echo "$changed_files" | grep "^models/" | cut -d/ -f1-3 | sort -u)

            if [ -z "$changed_model_dirs" ]; then
              echo "No model files changed in this PR"
              echo "[]" > plot-manifest.json
            else
              echo "Changed model directories:"
              echo "$changed_model_dirs"

              # Convert directory paths to FMU names
              # e.g., models/thermal/rc-thermal-single-zone → RcThermalSingleZone
              MODEL_NAMES=$(echo "$changed_model_dirs" | \
                awk -F/ '{print $NF}' | \
                awk -F- '{for(i=1;i<=NF;i++){$i=toupper(substr($i,1,1)) substr($i,2)}} 1' OFS="" | \
                paste -sd, -)

              echo "Plotting changed models: $MODEL_NAMES"
              # Run plot generation - errors will be printed to stderr
              if python scripts/generate_fmu_figures.py --models "$MODEL_NAMES" --output-manifest > plot-manifest.json; then
                echo "Plot generation completed successfully"
              else
                echo "::warning::Some plots failed to generate. Check stderr output above for details."
                # Create empty manifest if none exists
                [ -f plot-manifest.json ] || echo "[]" > plot-manifest.json
              fi
            fi
          else
            # For main branch or non-PR events, plot all models
            echo "Plotting all models"
            if python scripts/generate_fmu_figures.py --output-manifest > plot-manifest.json; then
              echo "Plot generation completed successfully"
            else
              echo "::warning::Some plots failed to generate. Check stderr output above for details."
              # Create empty manifest if none exists
              [ -f plot-manifest.json ] || echo "[]" > plot-manifest.json
            fi
          fi

          # Display manifest
          echo "Generated plots:"
          cat plot-manifest.json

      - name: Upload plot manifest
        uses: actions/upload-artifact@v4
        with:
          name: plot-manifest
          path: plot-manifest.json
          retention-days: 30

      - name: Upload FMU output figures
        uses: actions/upload-artifact@v4
        with:
          name: fmu-figures
          path: fmu-figures/*.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload FMU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fmus
          path: fmus/*.fmu
          retention-days: 7

      - name: Summary
        run: |
          echo "## ✅ FMU Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All FMUs built and tested successfully:" >> $GITHUB_STEP_SUMMARY
          ls fmus/*.fmu | while read fmu; do
            echo "- \`$(basename $fmu)\`" >> $GITHUB_STEP_SUMMARY
          done

  # Post FMU figures to PR comment
  pr-figures:
    needs: [fmu-integration]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download plot manifest
        uses: actions/download-artifact@v4
        with:
          name: plot-manifest
          path: .
        continue-on-error: true

      - name: Download FMU figures
        uses: actions/download-artifact@v4
        with:
          name: fmu-figures
          path: fmu-figures
        continue-on-error: true

      - name: Check if figures were generated
        id: check-figures
        run: |
          if [ -f "plot-manifest.json" ]; then
            echo "Manifest file found"
            cat plot-manifest.json

            # Count entries in manifest
            COUNT=$(jq 'length' plot-manifest.json 2>/dev/null || echo "0")
            echo "count=$COUNT" >> $GITHUB_OUTPUT

            # Set has_figures flag
            if [ "$COUNT" -gt 0 ] 2>/dev/null; then
              echo "Found $COUNT figure(s) to display"
              echo "has_figures=true" >> $GITHUB_OUTPUT
            else
              echo "No figures to display (count=$COUNT)"
              echo "has_figures=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No manifest found"
            echo "has_figures=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Setup and upload images to pr-images branch
        if: steps.check-figures.outputs.has_figures == 'true'
        run: |
          PR_NUM=${{ github.event.pull_request.number }}

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Try to checkout pr-images branch, create if it doesn't exist
          if git ls-remote --exit-code --heads origin pr-images; then
            echo "pr-images branch exists, checking out..."
            git fetch origin pr-images
            git checkout pr-images
          else
            echo "pr-images branch doesn't exist, creating..."
            git checkout --orphan pr-images
            git rm -rf .
            echo "# PR Images" > README.md
            echo "This branch stores images for PR comments" >> README.md
            git add README.md
            git commit -m "Initialize pr-images branch"
            git push origin pr-images
          fi

          # Create directory for this PR
          mkdir -p pr-${PR_NUM}

          # Copy images
          if [ -d "fmu-figures" ]; then
            cp fmu-figures/*.png pr-${PR_NUM}/ || true
          fi

          # Commit and push
          git add pr-${PR_NUM}/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update figures for PR #${PR_NUM}"
            git push origin pr-images
          fi

      - name: Build PR comment
        if: steps.check-figures.outputs.has_figures == 'true'
        id: build-comment
        run: |
          PR_NUM=${{ github.event.pull_request.number }}

          # Start building comment
          cat > comment.md << 'COMMENT_START'
          ## 📊 FMU Simulation Results

          Below are the output plots from FMU simulations for models changed in this PR. The figures are automatically updated on each CI run.

          COMMENT_START

          # Add each figure from the manifest
          jq -r '.[] | "### " + .model + "\n![" + .model + "](https://raw.githubusercontent.com/${{ github.repository }}/pr-images/pr-${{ github.event.pull_request.number }}/" + .figure + ")\n"' plot-manifest.json >> comment.md

          # Add footer
          cat >> comment.md << 'COMMENT_END'
          ---
          *Generated by CI run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) • [Download figures](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*
          COMMENT_END

          # Set output
          {
            echo 'body<<EOF_MARKER'
            cat comment.md
            echo EOF_MARKER
          } >> $GITHUB_OUTPUT

      - name: Post/Update PR comment with embedded images
        if: steps.check-figures.outputs.has_figures == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: fmu-simulation-results
          message: ${{ steps.build-comment.outputs.body }}

      - name: Post PR comment (no figures)
        if: steps.check-figures.outputs.has_figures == 'false'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: fmu-simulation-results
          message: |
            ## 📊 FMU Simulation Results

            No models were changed in this PR, so no simulation figures were generated.

            ---
            *CI run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*

  # Documentation build
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --workspace --no-deps

      - name: Create index redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=adml_dahlquist/index.html">' > target/doc/index.html

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc

  # Final status check
  ci-success:
    needs: [workspace-check, test-models, fmu-integration, pr-figures, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.workspace-check.result }}" != "success" ]] || \
             [[ "${{ needs.test-models.result }}" != "success" && "${{ needs.test-models.result }}" != "skipped" ]] || \
             [[ "${{ needs.fmu-integration.result }}" != "success" ]] || \
             [[ "${{ needs.pr-figures.result }}" != "success" && "${{ needs.pr-figures.result }}" != "skipped" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
