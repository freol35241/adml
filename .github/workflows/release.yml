name: Build and Release FMUs

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (e.g., "v1.0.0")'
        required: true
        default: ''
  push:
    tags:
      - 'v*'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Build multi-platform FMUs for all models (Linux + Windows binaries in single FMU)
  build-fmus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bin-cross-
            ${{ runner.os }}-cargo-bin-

      - name: Cache cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Docker for cross
        run: |
          docker --version
          docker info

      - name: Install cross
        run: |
          if ! command -v cross &> /dev/null; then
            echo "Installing cross..."
            cargo install cross
          else
            echo "cross is already installed"
            cross --version
          fi

      - name: Install zip utility
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build all multi-platform FMUs
        run: |
          set -x  # Enable verbose output for debugging
          ./scripts/build-all-multiplatform-fmus.sh

      - name: List built FMUs
        run: |
          echo "Built multi-platform FMUs (Linux x86_64 + Windows x86_64):"
          ls -lh fmus/*.fmu

      - name: Verify FMU contents
        run: |
          echo "Verifying multi-platform FMU structure..."
          for fmu in fmus/*.fmu; do
            echo ""
            echo "Contents of $(basename $fmu):"
            unzip -l "$fmu" | grep -E "(binaries|modelDescription)"
          done

      - name: Upload FMU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fmus
          path: fmus/*.fmu

  # Create GitHub release with all FMUs
  create-release:
    needs: build-fmus
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download FMU artifacts
        uses: actions/download-artifact@v4
        with:
          name: fmus
          path: fmus/

      - name: List downloaded FMUs
        run: |
          echo "📦 Multi-platform FMU files for release:"
          ls -lh fmus/*.fmu

      - name: Determine release details
        id: release-details
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            RELEASE_NAME="$RELEASE_INPUT_NAME"
            TAG="$RELEASE_INPUT_NAME"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="$TAG"
          fi

          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="release-$(date +%Y-%m-%d)"
            TAG="release-$(date +%Y%m%d-%H%M%S)"
          fi

          echo "name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release: $RELEASE_NAME (tag: $TAG)"
        env:
          RELEASE_INPUT_NAME: ${{ github.event.inputs.release_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Generate release notes
        run: |
          cat > release-notes.md << 'EOF'
          # ADML - AI-Generated Dynamical Model Library

          FMI 3.0 compatible FMU files ready to use in any FMI-supporting simulation tool.

          **Each FMU contains binaries for multiple platforms:**
          - ✅ **Linux x86_64** - Native .so library
          - ✅ **Windows x86_64** - Native .dll library

          Download once, run anywhere!

          ## 📦 Models in this Release

          EOF

          # List models with descriptions
          for fmu in fmus/*.fmu; do
            model_name=$(basename "$fmu" .fmu)
            echo "- **$model_name.fmu** - Multi-platform FMI 3.0 Co-Simulation model" >> release-notes.md
          done

          cat >> release-notes.md << 'EOF'

          ## 🚀 How to Use

          1. Download the FMU file for your desired model
          2. Load it in any FMI 3.0 compatible tool on Linux or Windows:
             - **FMPy** (Python) - Cross-platform
             - **Dymola** - Windows/Linux
             - **Simulink** with FMI Toolbox - Windows/Linux
             - **OpenModelica** - Cross-platform
             - And many more...

          The FMU will automatically use the correct binary for your platform!

          ## ✅ Testing

          All FMUs are thoroughly tested with:
          - **Tier 1**: Rust unit & physics tests
          - **Tier 2**: FMU integration tests with FMPy
          - **Tier 3**: FMI 3.0 compliance verification

          ## 📝 Models Included

          - **Dahlquist** - Simple ODE test equation: dx/dt = -k·x
          - **Van der Pol** - Nonlinear oscillator with limit cycle
          - **Bouncing Ball** - Ball with gravity and elastic collisions

          ## 📚 Documentation

          For detailed documentation, visit the [repository](https://github.com/$GITHUB_REPOSITORY).

          ## 🛠️ Technical Details

          - **FMI Version**: 3.0
          - **Mode**: Co-Simulation
          - **Platforms**: Linux x86_64, Windows x86_64 (both in each FMU)
          - **Built with**: Rust + fmu_from_struct
          - **Cross-compiled**: Using cross (cross-rs)

          EOF

          cat release-notes.md
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.release-details.outputs.name }}
          tag_name: ${{ steps.release-details.outputs.tag }}
          body_path: release-notes.md
          files: fmus/*.fmu
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🎉 Release Created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ steps.release-details.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.release-details.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Multi-Platform FMU Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Each FMU contains binaries for **Linux x86_64** and **Windows x86_64**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls fmus/*.fmu | while read fmu; do
            echo "- $(basename $fmu)" >> $GITHUB_STEP_SUMMARY
          done
