name: Build and Release FMUs

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (e.g., "v1.0.0")'
        required: true
        default: ''
  push:
    tags:
      - 'v*'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Build multi-platform FMUs for all models (Linux + Windows binaries in single FMU)
  build-fmus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bin-cross-
            ${{ runner.os }}-cargo-bin-

      - name: Cache cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Docker for cross
        run: |
          docker --version
          docker info

      - name: Install cross and cargo-fmi
        run: |
          if ! command -v cross &> /dev/null; then
            echo "Installing cross..."
            cargo install cross
          else
            echo "cross is already installed"
            cross --version
          fi
          cargo install cargo-fmi

      - name: Install zip utility
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build all multi-platform FMUs
        run: |
          set -x  # Enable verbose output for debugging
          ./scripts/build-all-multiplatform-fmus.sh

      - name: List built FMUs
        run: |
          echo "Built multi-platform FMUs (Linux x86_64 + Windows x86_64):"
          ls -lh fmus/*.fmu

      - name: Verify FMU contents
        run: |
          echo "Verifying multi-platform FMU structure..."
          for fmu in fmus/*.fmu; do
            echo ""
            echo "Contents of $(basename $fmu):"
            unzip -l "$fmu" | grep -E "(binaries|modelDescription)"
          done

      - name: Upload FMU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fmus
          path: fmus/*.fmu

  # Create GitHub release with all FMUs
  create-release:
    needs: build-fmus
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download FMU artifacts
        uses: actions/download-artifact@v4
        with:
          name: fmus
          path: fmus/

      - name: List downloaded FMUs
        run: |
          echo "📦 Multi-platform FMU files for release:"
          ls -lh fmus/*.fmu

      - name: Determine release details
        id: release-details
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            RELEASE_NAME="$RELEASE_INPUT_NAME"
            TAG="$RELEASE_INPUT_NAME"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="$TAG"
          fi

          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="release-$(date +%Y-%m-%d)"
            TAG="release-$(date +%Y%m%d-%H%M%S)"
          fi

          echo "name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release: $RELEASE_NAME (tag: $TAG)"
        env:
          RELEASE_INPUT_NAME: ${{ github.event.inputs.release_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Generate release notes
        run: |
          # Get workspace version from Cargo.toml
          WORKSPACE_VERSION=$(grep -A5 '^\[workspace.package\]' Cargo.toml | grep '^version' | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/')

          # Get FMI version from a model Cargo.toml
          FMI_VERSION=$(grep 'fmi_version' models/mathematical/dahlquist/Cargo.toml | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/' || echo "3.0")

          # Count models
          MODEL_COUNT=$(ls -1 fmus/*.fmu 2>/dev/null | wc -l)

          # Get git info for changelog
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_SHA=$(git rev-parse --short HEAD)

          # Get supported platforms from Cross.toml
          PLATFORMS=""
          if [ -f Cross.toml ]; then
            PLATFORMS=$(grep '^\[target\.' Cross.toml | sed 's/\[target\.\(.*\)\]/\1/' | tr '\n' ', ' | sed 's/,$//')
          fi

          cat > release-notes.md << EOF
          # ADML - AI-Generated Dynamical Model Library

          > **Release**: ${{ steps.release-details.outputs.name }} | **Models**: ${MODEL_COUNT} | **FMI**: ${FMI_VERSION}

          FMI ${FMI_VERSION} compatible FMU files ready to use in any FMI-supporting simulation tool.

          **Each FMU contains binaries for multiple platforms:**
          - ✅ **Linux x86_64** - Native .so library
          - ✅ **Windows x86_64** - Native .dll library

          Download once, run anywhere!

          ---

          ## 📦 Models in this Release

          EOF

          # Generate model table dynamically from Cargo.toml metadata
          echo "| Model | Version | Description |" >> release-notes.md
          echo "|-------|---------|-------------|" >> release-notes.md

          for fmu in fmus/*.fmu; do
            model_name=$(basename "$fmu" .fmu)

            # Find the matching Cargo.toml for this model
            cargo_toml=""
            for toml in models/*/*/Cargo.toml; do
              if grep -q "model_name = \"$model_name\"" "$toml" 2>/dev/null; then
                cargo_toml="$toml"
                break
              fi
            done

            if [ -n "$cargo_toml" ] && [ -f "$cargo_toml" ]; then
              # Extract version and description from Cargo.toml
              model_version=$(grep '^version = ' "$cargo_toml" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/')
              model_desc=$(grep '^description = ' "$cargo_toml" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/')

              # Get FMI-specific description if available
              fmi_desc=$(grep -A5 '\[package.metadata.fmi\]' "$cargo_toml" | grep 'description' | sed 's/.*= *"\([^"]*\)".*/\1/')

              # Use FMI description if available, otherwise package description
              final_desc="${fmi_desc:-$model_desc}"
              final_desc="${final_desc:-Multi-platform FMI ${FMI_VERSION} Co-Simulation model}"

              echo "| **${model_name}.fmu** | ${model_version:-1.0.0} | ${final_desc} |" >> release-notes.md
            else
              echo "| **${model_name}.fmu** | - | Multi-platform FMI ${FMI_VERSION} Co-Simulation model |" >> release-notes.md
            fi
          done

          cat >> release-notes.md << EOF

          ---

          <details>
          <summary><strong>🚀 How to Use</strong></summary>

          ### Quick Start

          1. Download the FMU file for your desired model
          2. Load it in any FMI ${FMI_VERSION} compatible tool on Linux or Windows

          ### Supported Tools

          | Tool | Platform | Notes |
          |------|----------|-------|
          | **FMPy** | Cross-platform | Python library, great for scripting |
          | **Dymola** | Windows/Linux | Commercial Modelica environment |
          | **Simulink** | Windows/Linux | With FMI Toolbox |
          | **OpenModelica** | Cross-platform | Open-source Modelica |
          | **PyFMI** | Cross-platform | Python FMI library |
          | **INTO-CPS** | Cross-platform | Co-simulation framework |

          The FMU will automatically use the correct binary for your platform!

          </details>

          <details>
          <summary><strong>✅ Testing & Quality</strong></summary>

          All FMUs are thoroughly tested with a multi-tier approach:

          | Tier | Type | Description |
          |------|------|-------------|
          | **Tier 1** | Unit Tests | Rust unit tests for model logic |
          | **Tier 2** | Physics Tests | Validation against analytical solutions |
          | **Tier 3** | Integration Tests | FMU integration tests with FMPy |
          | **Tier 4** | Compliance | FMI ${FMI_VERSION} standard verification |

          </details>

          EOF

          # Generate model details section dynamically
          echo "<details>" >> release-notes.md
          echo "<summary><strong>📝 Model Details</strong></summary>" >> release-notes.md
          echo "" >> release-notes.md

          for fmu in fmus/*.fmu; do
            model_name=$(basename "$fmu" .fmu)
            fmu_size=$(ls -lh "$fmu" | awk '{print $5}')

            # Find the matching Cargo.toml for this model
            cargo_toml=""
            for toml in models/*/*/Cargo.toml; do
              if grep -q "model_name = \"$model_name\"" "$toml" 2>/dev/null; then
                cargo_toml="$toml"
                break
              fi
            done

            if [ -n "$cargo_toml" ] && [ -f "$cargo_toml" ]; then
              model_version=$(grep '^version = ' "$cargo_toml" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/')
              model_desc=$(grep '^description = ' "$cargo_toml" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/')
              model_guid=$(grep 'guid = ' "$cargo_toml" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/')

              # Get lib.rs path for doc comment extraction
              lib_dir=$(dirname "$cargo_toml")
              lib_rs="${lib_dir}/src/lib.rs"

              echo "### ${model_name}" >> release-notes.md
              echo "" >> release-notes.md
              echo "- **Version**: ${model_version:-1.0.0}" >> release-notes.md
              echo "- **Description**: ${model_desc:-N/A}" >> release-notes.md
              echo "- **GUID**: \`${model_guid:-N/A}\`" >> release-notes.md
              echo "- **File Size**: ${fmu_size}" >> release-notes.md

              # Extract platforms from FMU
              echo "- **Platforms**:" >> release-notes.md
              unzip -l "$fmu" 2>/dev/null | grep 'binaries/' | sed 's/.*binaries\//  - /' | sed 's/\/.*//' | sort -u >> release-notes.md || echo "  - See FMU contents" >> release-notes.md

              echo "" >> release-notes.md
            fi
          done

          echo "</details>" >> release-notes.md
          echo "" >> release-notes.md

          # Add changelog section if there's a previous tag
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "<details>" >> release-notes.md
            echo "<summary><strong>📋 Changelog (since ${PREVIOUS_TAG})</strong></summary>" >> release-notes.md
            echo "" >> release-notes.md
            echo "| Commit | Description |" >> release-notes.md
            echo "|--------|-------------|" >> release-notes.md
            git log ${PREVIOUS_TAG}..HEAD --pretty=format:"| \`%h\` | %s |" >> release-notes.md
            echo "" >> release-notes.md
            echo "" >> release-notes.md
            echo "</details>" >> release-notes.md
            echo "" >> release-notes.md
          fi

          cat >> release-notes.md << EOF
          <details>
          <summary><strong>🛠️ Technical Details</strong></summary>

          ### Build Information

          | Property | Value |
          |----------|-------|
          | **FMI Version** | ${FMI_VERSION} |
          | **Mode** | Co-Simulation |
          | **Platforms** | Linux x86_64, Windows x86_64 |
          | **Build Date** | ${BUILD_DATE} |
          | **Commit** | \`${COMMIT_SHA}\` |
          | **Workspace Version** | ${WORKSPACE_VERSION} |

          ### Build Stack

          - **Language**: Rust (stable)
          - **FMI Library**: fmi-export (rust-fmi)
          - **Cross-compilation**: cross (cross-rs)
          - **CI/CD**: GitHub Actions

          ### FMU Structure

          Each FMU file is a ZIP archive containing:
          \`\`\`
          modelDescription.xml      # FMI model description
          binaries/
            x86_64-linux/          # Linux shared library (.so)
            x86_64-windows/        # Windows DLL (.dll)
          \`\`\`

          </details>

          ---

          ## 📚 Documentation

          For detailed documentation, examples, and contribution guidelines, visit the [repository](https://github.com/${GITHUB_REPOSITORY}).

          EOF

          cat release-notes.md
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release-details.outputs.name }}
          tag_name: ${{ steps.release-details.outputs.tag }}
          body_path: release-notes.md
          files: fmus/*.fmu
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          # Get dynamic info
          WORKSPACE_VERSION=$(grep -A5 '^\[workspace.package\]' Cargo.toml | grep '^version' | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/')
          FMI_VERSION=$(grep 'fmi_version' models/mathematical/dahlquist/Cargo.toml | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/' || echo "3.0")
          MODEL_COUNT=$(ls -1 fmus/*.fmu 2>/dev/null | wc -l)
          TOTAL_SIZE=$(du -ch fmus/*.fmu | tail -1 | cut -f1)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_SHA=$(git rev-parse --short HEAD)

          echo "## 🎉 Release Created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Release** | ${{ steps.release-details.outputs.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | ${{ steps.release-details.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${COMMIT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **FMI Version** | ${FMI_VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workspace Version** | ${WORKSPACE_VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Date** | ${BUILD_DATE} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Multi-Platform FMU Files (${MODEL_COUNT} models, ${TOTAL_SIZE} total)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Each FMU contains binaries for **Linux x86_64** and **Windows x86_64**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Model | Version | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|------|" >> $GITHUB_STEP_SUMMARY
          for fmu in fmus/*.fmu; do
            model_name=$(basename "$fmu" .fmu)
            fmu_size=$(ls -lh "$fmu" | awk '{print $5}')

            # Find model version
            model_version=""
            for toml in models/*/*/Cargo.toml; do
              if grep -q "model_name = \"$model_name\"" "$toml" 2>/dev/null; then
                model_version=$(grep '^version = ' "$toml" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/')
                break
              fi
            done

            echo "| ${model_name}.fmu | ${model_version:-1.0.0} | ${fmu_size} |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Platforms Included" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🐧 **Linux x86_64** - Native .so library" >> $GITHUB_STEP_SUMMARY
          echo "- 🪟 **Windows x86_64** - Native .dll library" >> $GITHUB_STEP_SUMMARY
