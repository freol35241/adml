[workspace]
resolver = "2"

members = [
    "models/mathematical/*",
    "models/mechanical/*",
    "testing/fmi-compliance",
    "testing/physics-framework",
]

exclude = [
    "models/*/experimental-*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freol35241/odml"

[workspace.dependencies]
# FMI export dependencies - using rust-fmi from git
# Note: fmi-export is not published separately, so we use git dependencies
fmi = { git = "https://github.com/jondo2010/rust-fmi.git", features = ["fmi3"] }
fmi-export = { git = "https://github.com/jondo2010/rust-fmi.git", features = ["fmi3"] }

# Testing dependencies
approx = "0.5"
criterion = "0.5"

# Packaging utilities
zip = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
walkdir = "2.0"
cargo_metadata = "0.18"
chrono = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
