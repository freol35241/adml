# Model Specification: Simple Pendulum
# This file provides a machine-readable specification of the model.

[model]
name = "SimplePendulum"
struct_name = "SimplePendulum"
package = "adml-simple-pendulum"
version = "1.0.0"
category = "mechanical"
complexity = "medium"
description = "Classical simple pendulum with nonlinear dynamics and optional damping"
fmi_version = "3.0"

[equations]
system_type = "ode"
linearity = "nonlinear"  # Due to sin(theta)
autonomy = "autonomous"

[[equations.differential]]
state = "theta"
derivative = "omega"
description = "Angular position changes at angular velocity"

[[equations.differential]]
state = "omega"
derivative = "-(g/L) * sin(theta) - (b/m) * omega"
description = "Angular acceleration from gravity and damping"

[equations.analytical_solution]
available = true
valid_for = "Small angle approximation (|theta| < 0.2 rad)"
formula = "theta(t) = theta0 * cos(omega_n * t) + (omega0/omega_n) * sin(omega_n * t)"
notes = "omega_n = sqrt(g/L) is the natural frequency"

[parameters]
[parameters.g]
type = "Real"
default = 9.81
unit = "m/s^2"
description = "Gravitational acceleration"
constraints = "g > 0"
fmi_causality = "parameter"

[parameters.L]
type = "Real"
default = 1.0
unit = "m"
description = "Pendulum length"
constraints = "L > 0"
fmi_causality = "parameter"

[parameters.m]
type = "Real"
default = 1.0
unit = "kg"
description = "Mass of bob"
constraints = "m > 0"
fmi_causality = "parameter"

[parameters.b]
type = "Real"
default = 0.0
unit = "kg/s"
description = "Damping coefficient"
constraints = "b >= 0"
fmi_causality = "parameter"

[initial_conditions]
[initial_conditions.theta]
type = "Real"
default = 0.1
unit = "rad"
description = "Initial angular displacement from vertical"
fmi_causality = "output"

[initial_conditions.omega]
type = "Real"
default = 0.0
unit = "rad/s"
description = "Initial angular velocity"
fmi_causality = "output"

[outputs]
[outputs.theta]
type = "Real"
unit = "rad"
description = "Angular position"

[outputs.omega]
type = "Real"
unit = "rad/s"
description = "Angular velocity"

[outputs.energy]
type = "Real"
unit = "J"
description = "Total mechanical energy"

[outputs.KE]
type = "Real"
unit = "J"
description = "Kinetic energy"

[outputs.PE]
type = "Real"
unit = "J"
description = "Potential energy"

[validation]
[validation.analytical]
method = "small_angle_comparison"
notes = "For |theta| < 0.2 rad, compare to harmonic oscillator solution"

[[validation.analytical.checkpoints]]
time = 0.0
variable = "theta"
expected = 0.1
tolerance = 1e-10
description = "Initial angle"

[validation.energy]
method = "conservation_check"
undamped_tolerance = 0.01  # 1% for symplectic Euler
damped_behavior = "monotonic_decrease"
notes = "Energy conserved (undamped) or decreases (damped)"

[validation.convergence]
method = "step_size_refinement"
step_sizes = [0.1, 0.01, 0.001]
expected_order = 1
error_should_decrease = true

[validation.properties]
small_angle_period = 2.006  # 2*pi*sqrt(L/g) for L=1, g=9.81
energy_conserved_undamped = true
energy_decreases_damped = true
amplitude_bounded = true

[validation.frequency]
method = "period_measurement"
expected_period = 2.006  # seconds for L=1, g=9.81
tolerance = 0.05
valid_for = "Small angles only"

[testing]
required = [
    "initialization",
    "derivative_calculation",
    "small_angle_analytical",
    "energy_conservation",
    "damping_effect",
    "convergence",
    "period_measurement"
]

euler_step_size = 0.01
simulation_tolerance = 0.05

[testing.edge_cases]
small_angle = { theta = 0.1, notes = "Harmonic approximation valid" }
large_angle = { theta = 1.5, notes = "Full nonlinear behavior" }
undamped = { b = 0.0, notes = "Energy conservation test" }
damped = { b = 0.1, notes = "Energy dissipation test" }
moon_gravity = { g = 1.62, notes = "Different period" }

[references]
[[references.sources]]
type = "textbook"
name = "Classical Mechanics"
author = "Goldstein, Poole, and Safko"
edition = "3rd"
notes = "Standard pendulum treatment"

[[references.sources]]
type = "textbook"
name = "Nonlinear Dynamics and Chaos"
author = "Steven Strogatz"
notes = "Nonlinear pendulum analysis"

[[references.sources]]
type = "book"
name = "The Pendulum: A Case Study in Physics"
author = "Baker and Blackburn"
notes = "Comprehensive pendulum physics"
