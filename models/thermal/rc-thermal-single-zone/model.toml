# Model Specification: RC Thermal Single Zone
# This file provides a machine-readable specification of the model.

[model]
name = "RcThermalSingleZone"
struct_name = "RcThermalSingleZone"
package = "adml-rc-thermal-single-zone"
version = "1.0.0"
category = "thermal"
complexity = "simple"
description = "Single-zone thermal model using RC circuit analogy for building simulation"
fmi_version = "3.0"

[equations]
system_type = "ode"
linearity = "linear"
autonomy = "autonomous"

[[equations.differential]]
state = "T_indoor"
derivative = "(Q_heat - (T_indoor - T_ambient) / R_th) / C_th"
description = "Temperature change from heat input minus heat loss"

[equations.derived_outputs]
Q_loss = "(T_indoor - T_ambient) / R_th"
dT_dt = "(Q_heat - Q_loss) / C_th"

[equations.analytical_solution]
available = true
formula = "T_indoor(t) = T_ss + (T_0 - T_ss) * exp(-t / tau)"
notes = "tau = R_th * C_th, T_ss = T_ambient + Q_heat * R_th"

[equations.steady_state]
available = true
formula = "T_indoor_ss = T_ambient + Q_heat * R_th"
notes = "Reached when dT_indoor/dt = 0"

[parameters]
[parameters.R_th]
type = "Real"
default = 0.01
unit = "K/W"
description = "Thermal resistance (insulation quality)"
constraints = "R_th > 0"
fmi_causality = "parameter"

[parameters.C_th]
type = "Real"
default = 10000000.0
unit = "J/K"
description = "Thermal capacitance (thermal mass)"
constraints = "C_th > 0"
fmi_causality = "parameter"

[parameters.T_ambient]
type = "Real"
default = 0.0
unit = "degC"
description = "Outdoor/ambient temperature"
fmi_causality = "parameter"

[parameters.Q_heat]
type = "Real"
default = 5000.0
unit = "W"
description = "Heating power input"
constraints = "Q_heat >= 0"
fmi_causality = "parameter"

[initial_conditions]
[initial_conditions.T_indoor]
type = "Real"
default = 20.0
unit = "degC"
description = "Initial indoor temperature"
fmi_causality = "output"

[outputs]
[outputs.T_indoor]
type = "Real"
unit = "degC"
description = "Indoor temperature (state variable)"

[outputs.Q_loss]
type = "Real"
unit = "W"
description = "Heat loss through building envelope (derived)"

[outputs.dT_dt]
type = "Real"
unit = "K/s"
description = "Rate of temperature change (derived)"

[validation]
[validation.analytical]
method = "exponential_response_comparison"
formula = "T(t) = T_ss + (T_0 - T_ss) * exp(-t / tau)"
notes = "Compare simulated response to analytical exponential decay"

[[validation.analytical.checkpoints]]
time = 0.0
variable = "T_indoor"
expected = 20.0
tolerance = 1e-10
description = "Initial temperature"

[[validation.analytical.checkpoints]]
time = 100000.0  # One time constant
variable = "T_indoor"
expected = 38.96  # T_ss + (T_0 - T_ss) * 0.368 for default params
tolerance = 0.05
description = "After one time constant (63.2% to steady state)"

[validation.steady_state]
method = "energy_balance"
condition = "Q_heat = Q_loss"
expected_T_indoor = 50.0  # T_ambient + Q_heat * R_th = 0 + 5000 * 0.01
tolerance = 0.01

[validation.time_constant]
tau = 100000.0  # R_th * C_th = 0.01 * 10e6
tolerance = 0.05

[validation.convergence]
method = "step_size_refinement"
step_sizes = [100.0, 10.0, 1.0]
expected_order = 1
error_should_decrease = true

[validation.properties]
linear_system = true
asymptotically_stable = true
steady_state_exists = true

[testing]
required = [
    "initialization",
    "derivative_calculation",
    "analytical_solution",
    "steady_state_energy_balance",
    "time_constant_verification",
    "convergence",
    "parameter_sensitivity"
]

euler_step_size = 10.0  # Seconds; tau is ~100000s
simulation_tolerance = 0.05

[testing.edge_cases]
no_heating = { Q_heat = 0.0, expected_behavior = "approach_ambient" }
poor_insulation = { R_th = 0.005, notes = "Lower steady-state temperature" }
good_insulation = { R_th = 0.02, notes = "Higher steady-state temperature" }
high_thermal_mass = { C_th = 50000000.0, notes = "Slower response" }
cold_ambient = { T_ambient = -20.0, notes = "More heat loss" }

[references]
[[references.sources]]
type = "standard"
name = "ISO 52016-1:2017"
description = "Energy performance of buildings - Calculation procedures"

[[references.sources]]
type = "journal"
author = "Bacher, P., & Madsen, H."
title = "Identifying suitable models for the heat dynamics of buildings"
journal = "Energy and Buildings"
year = 2011
volume = "43(7)"
pages = "1511-1522"

[[references.sources]]
type = "textbook"
name = "Building Energy Simulation"
notes = "RC thermal network models are standard in building physics"
